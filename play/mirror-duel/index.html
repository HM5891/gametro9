<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirror Duel · Gametro9</title>
<meta name="theme-color" content="#14163a">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
:root{--a:#f0412b;--b:#2f5bff;--ink:#14163a;--g9-dim:#565a7e}
html,body{height:100%;margin:0}
body{background:#eef0fb;color:var(--ink);font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
main{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%;max-width:440px}
.pl{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;transition:box-shadow .15s,transform .15s}
.pl.on{box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
.pl:last-child{flex-direction:row-reverse;text-align:right}
.pl i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
.pl b{display:block;font:800 15px 'Figtree',sans-serif}
.pl small{font:700 11px 'Overpass Mono',monospace;letter-spacing:.08em;color:#565a7e}
.vs{font:800 22px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.status{font-weight:800;font-size:16px;min-height:22px;text-align:center}
.board{position:relative;width:min(100%,440px);aspect-ratio:1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:20px}
.board::before{content:"";position:absolute;top:8px;bottom:8px;left:50%;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(var(--ink) 0 8px,transparent 8px 14px);opacity:.35}
.board::after{content:"MIRROR";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font:700 10px 'Overpass Mono',monospace;letter-spacing:.14em;padding:2px 8px;border-radius:5px}
.c{position:relative;border:0;border-radius:12px;background:#f1f3fc;cursor:pointer;padding:0}
.c:hover:not(:disabled){background:#e3e7f8}
.c:disabled{cursor:default}
.c span{position:absolute;inset:12%;border-radius:50%;border:3px solid var(--ink);animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
.c.A span{background:var(--a)}.c.B span{background:var(--b)}
.c.gift span{animation:mir .45s ease-out}
.c.win span{box-shadow:0 0 0 4px #ffc929}
.c.last span::after{content:"";position:absolute;inset:30%;border-radius:50%;background:rgba(255,255,255,.75)}
@keyframes pop{from{transform:scale(.2)}to{transform:none}}
@keyframes mir{0%{transform:scaleX(-.1);opacity:.2}100%{transform:none;opacity:1}}
.rule{max-width:440px;text-align:center;font-size:14px;color:#565a7e;font-weight:600}
@media (prefers-reduced-motion:reduce){.c span{animation:none}}
</style>
</head>
<body>
<main>
  <div class="score"><div class="pl" id="pA"><i style="background:var(--a)"></i><div><b id="nA">You</b><small>4 IN A ROW</small></div></div><div class="vs" id="tally">0 – 0</div><div class="pl" id="pB"><i style="background:var(--b)"></i><div><b id="nB">Rival</b><small>4 IN A ROW</small></div></div></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="board" id="board" role="grid" aria-label="Mirror Duel board"></div>
  <p class="rule">Every stone you place also places a rival stone in the mirrored square on the other side, if that square is empty.</p>
</main>
<script src="../g9kit.js"></script>
<script>
G9.bar({code:'P-02',line:'Puzzle line',color:'#2f5bff'});
const N=6, WIN=4, $=id=>document.getElementById(id);
let B, turn, mode, level, over, tally={A:0,B:0}, lastMove=-1, gifted=-1, busy=false;
const mirror=i=>{ const r=Math.floor(i/N), c=i%N; return r*N+(N-1-c); };
const other=p=>p==='A'?'B':'A';
const LINES=(()=>{ const L=[]; const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of dirs){ const cells=[]; for(let k=0;k<WIN;k++){ const rr=r+dr*k, cc=c+dc*k; if(rr<0||rr>=N||cc<0||cc>=N){cells.length=0;break;} cells.push(rr*N+cc); } if(cells.length===WIN) L.push(cells); } return L; })();
function winner(b,p){ return LINES.find(l=>l.every(i=>b[i]===p)); }
function play(b,p,i){ const nb=b.slice(); nb[i]=p; const m=mirror(i); let g=-1; if(m!==i&&!nb[m]){ nb[m]=other(p); g=m; }
  const wp=winner(nb,p), wo=winner(nb,other(p)); return {b:nb,g,res:wp?p:(wo?other(p):(nb.every(Boolean)?'draw':null)),line:wp||wo}; }
function evalB(b,p){ let s=0; for(const l of LINES){ let a=0,o=0; for(const i of l){ if(b[i]===p)a++; else if(b[i]) o++; } if(a&&!o) s+=a*a*a; if(o&&!a) s-=o*o*o*1.1; } return s; }
function aiMove(p){ const empty=B.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if(level==='Easy'){ const safe=empty.filter(i=>play(B,p,i).res!==other(p)); const win=empty.find(i=>play(B,p,i).res===p); return win??G9.pick(safe.length?safe:empty); }
  let best=-1e9, pick=empty[0];
  for(const i of empty){ const r=play(B,p,i); let sc;
    if(r.res===p) sc=1e6; else if(r.res===other(p)) sc=-1e6; else if(r.res==='draw') sc=0;
    else if(level==='Hard'){ let worst=1e9; for(const j of r.b.map((v,k)=>v?-1:k).filter(k=>k>=0)){ const r2=play(r.b,other(p),j); const s2=r2.res===other(p)?-1e6:r2.res===p?1e6:evalB(r2.b,p); if(s2<worst) worst=s2; if(worst<=-1e6) break; } sc=worst; }
    else sc=evalB(r.b,p);
    sc+=Math.random()*0.5; if(sc>best){ best=sc; pick=i; } }
  return pick; }
function render(win){ const bd=$('board'); bd.innerHTML=B.map((v,i)=>`<button class="c ${v||''}${i===gifted?' gift':''}${i===lastMove?' last':''}${win&&win.includes(i)?' win':''}" data-i="${i}" ${v||over||busy||(mode==='cpu'&&turn==='B')?'disabled':''} aria-label="Row ${Math.floor(i/N)+1}, column ${i%N+1}${v?(v==='A'?', '+$('nA').textContent:', '+$('nB').textContent):', empty'}">${v?'<span></span>':''}</button>`).join('');
  $('pA').classList.toggle('on',!over&&turn==='A'); $('pB').classList.toggle('on',!over&&turn==='B'); $('tally').textContent=`${tally.A} – ${tally.B}`; }
function status(t){ $('status').textContent=t; }
function move(i){ if(over||B[i]) return; const r=play(B,turn,i); B=r.b; lastMove=i; gifted=r.g; G9.vibrate(10);
  if(r.res){ over=true; render(r.line); finish(r.res); return; }
  turn=other(turn); render(); prompt(); }
function prompt(){ if(mode==='cpu'&&turn==='B'){ busy=true; render(); status('Rival is thinking…'); setTimeout(()=>{ busy=false; move(aiMove('B')); },level==='Hard'?500:380); }
  else status(mode==='cpu'?'Your turn':`${turn==='A'?$('nA').textContent:$('nB').textContent}'s turn`); }
function finish(res){ const nA=$('nA').textContent, nB=$('nB').textContent;
  if(res!=='draw') tally[res]++; render(winner(B,res)||null);
  const t=res==='draw'?'Board full: draw':(mode==='cpu'?(res==='A'?'You win!':'Rival wins'):`${res==='A'?nA:nB} wins!`);
  status(t);
  if(mode==='cpu'&&res==='A'){ const w=G9.load('mirror-wins',{}); w[level]=(w[level]||0)+1; G9.save('mirror-wins',w); }
  setTimeout(()=>G9.over({tag:'Duel over',title:t,sub:mode==='cpu'?`${level} · vs computer`:'2 players on one phone',stats:[[mode==='cpu'?'You':nA,tally.A],[mode==='cpu'?'Rival':nB,tally.B]],
    note:res!=='draw'&&gifted>=0&&winner(B,res)&&winner(B,res).includes(gifted)?'The winning line was finished by a mirrored stone.':'',retry:'Next round',onRetry:()=>start(level,mode,true),onMenu:menu}),900); }
function start(lv,md,keep){ level=lv; mode=md; if(!keep) tally={A:0,B:0}; B=Array(N*N).fill(null); over=false; lastMove=-1; gifted=-1;
  $('nA').textContent=mode==='cpu'?'You':'Player 1'; $('nB').textContent=mode==='cpu'?'Rival':'Player 2';
  turn=(tally.A+tally.B)%2?'B':'A'; render(); prompt(); }
$('board').addEventListener('click',e=>{ const c=e.target.closest('.c'); if(c&&!c.disabled) move(+c.dataset.i); });
function menu(){ G9.menu({id:'mirror',title:'Mirror Duel',code:'P-02',hook:'Whatever you build, your rival gets it flipped.',
  how:'Get <b>4 in a row</b> on the 6×6 board. But every stone you place also gives your rival a stone in the <b>mirrored square</b> on the other side. Use it to block them, or fill their mirror first.',
  modes:[{v:'cpu',t:'vs Computer'},{v:'two',t:'2 players'}],levels:['Easy','Normal','Hard'],
  best:lv=>{ const w=G9.load('mirror-wins',{})[lv]; return w?`Wins vs computer on ${lv}: ${w}`:''; },onStart:(lv,md)=>start(lv,md)}); }
B=Array(N*N).fill(null); over=true; render(); menu();
</script>
</body>
</html>
